params:
  - id: tmdb_api_key
    type: secret
    name: TMDB API Key
    description: "TMDB API key for movie and TV metadata. Hound only uses TMDB, so without a key search, posters and episode info stay empty."
    optional: true
    default_value: ""

  - id: mdblist_api_key
    type: secret
    name: MDBList API Key
    description: "MDBList API key for importing MDBList lists. Leave empty to disable MDBList catalogs."
    optional: true
    default_value: ""

  - id: media_dir
    type: string
    name: Media Library Folder
    description: "Folder name under this app's documents directory, mounted read-only at /extlib. Put existing media in Movies and TV Shows subfolders inside it."
    optional: true
    default_value: "Media"

  - id: enable_external_library
    type: bool
    name: External Library Scan
    description: "Scan /extlib/Movies and /extlib/TV Shows. Keep it off until the folders actually contain media, otherwise the scanner does nothing useful."
    optional: true
    default_value: "false"

